<!DOCTYPE html>
<html>
<head>
    <title>Stealth Chat</title>
    <style>
        /* WhatsApp Theme Colors and Layout */
        body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; background: #ece5dd; margin: 0; display: flex; justify-content: center; height: 100vh; align-items: center; }
        #chat-box { width: 100%; max-width: 450px; background: #efeae2; height: 100vh; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #chat-header { background: #00a884; color: white; padding: 15px 20px; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: space-between; }
        #messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 8px 12px; border-radius: 8px; max-width: 75%; word-wrap: break-word; font-size: 15px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .sent { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .received { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; }
        .stealth-mode { text-align: center; background: transparent; box-shadow: none; cursor: pointer; font-size: 40px; line-height: 1; }
        .unlock-btn { font-size: 12px; color: #007bff; display: block; margin-top: 5px; font-family: sans-serif; font-weight: bold; }
        #input-area { display: flex; padding: 10px; background: #f0f2f5; align-items: center; }
        input[type="text"] { flex-grow: 1; padding: 12px 15px; border: none; border-radius: 20px; outline: none; font-size: 15px; background: #ffffff; }
        button { background: #00a884; color: white; border: none; padding: 12px 20px; margin-left: 10px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        @media (min-width: 500px) { #chat-box { height: 90vh; border-radius: 10px; overflow: hidden; } }
    </style>
</head>
<body>

<div id="chat-box">
    <div id="chat-header">
        <span>Stealth Chat</span>
        <span id="room-display" style="font-size: 12px; opacity: 0.8;"></span>
    </div>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // 1. Separate Prompts for Room, Nickname, and PIN
    let roomName = prompt("1. Enter a Chat Room Name (You and your friend must type the exact same name to connect):", "SecretRoom");
    if (!roomName) roomName = "SecretRoom";

    let myNickname = prompt("2. Enter your Nickname (This will show under your ghost emojis):", "Agent");
    if (!myNickname) myNickname = "Agent";

    let secretPin = prompt("3. Set your secret PIN to unlock messages:", "1234");
    if (!secretPin) secretPin = "1234";

    // Display the room name in the top right corner
    document.getElementById("room-display").innerText = "Room: " + roomName;

    const myId = Math.random().toString(36).substring(2, 10);
    
    // Connect specifically to the private room
    const ws = new WebSocket("ws://" + window.location.host + "/ws/" + encodeURIComponent(roomName));
    const messagesDiv = document.getElementById("messages");
    const disguises = ["👻", "👽", "👾", "🤖", "🎃", "🙈", "🕵️‍♂️", "🔒"];

    ws.onmessage = function(event) {
        let data;
        try {
            data = JSON.parse(event.data);
        } catch (e) {
            data = { senderId: "unknown", nickname: "Unknown", text: event.data };
        }
        
        const msgElement = document.createElement("div");
        msgElement.classList.add("message");

        if (data.senderId === myId) {
            msgElement.classList.add("sent");
        } else {
            msgElement.classList.add("received");
        }

        msgElement.innerText = data.text;
        messagesDiv.appendChild(msgElement);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        // Pass the specific sender's nickname to the masking function
        setTimeout(() => {
            maskMessage(msgElement, data.text, data.nickname);
        }, 5000);
    };

    function maskMessage(element, text, senderNickname) {
        const randomEmoji = disguises[Math.floor(Math.random() * disguises.length)];

        // Display the user's nickname instead of "Unlock"
        element.innerHTML = randomEmoji + "<br><span class='unlock-btn'>" + senderNickname + "</span>";
        element.classList.add("stealth-mode");

        element.onclick = function() {
            const userPin = prompt("Enter PIN:");
            if (userPin === secretPin) {
                element.innerText = text;
                element.classList.remove("stealth-mode");
                element.onclick = null; 

                // Hide it again and re-apply the correct nickname
                setTimeout(() => {
                    maskMessage(element, text, senderNickname);
                }, 5000);
            } else if (userPin !== null) {
                alert("Incorrect PIN");
            }
        };
    }

    function sendMessage() {
        const input = document.getElementById("messageInput");
        if (input.value.trim() !== "") {
            // Send the nickname alongside the message
            const payload = {
                senderId: myId,
                nickname: myNickname,
                text: input.value
            };
            ws.send(JSON.stringify(payload));
            input.value = "";
        }
    }

    document.getElementById("messageInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") sendMessage();
    });
</script>
</body>
</html>
